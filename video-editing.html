<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- BROWSER TAB: edit the page title and description here. -->
    <title>
      Video Editing — Donne Crislee E. Vicera
    </title>
    <meta name="description" content="Graphic design and video editing. A personal creative portfolio.">
    <link rel="icon" type="image/svg+xml" href="images/wordmark2.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="glass-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="video-gallery.css">
    <script src="video-gallery.js" defer></script>
    <script src="portfolio.js" defer></script>
    <script src="script.js" defer></script>
    <script src="theme.js"></script>
  </head>
  <body data-page="video">
    <a class="skip" href="#main">
      Skip to content
    </a>
    <!-- HEADER / NAVIGATION — shared name comes from portfolio.js -->
    <header class="header wrap">
      <!-- EDIT: Your initials and name are set once in portfolio.js. -->
      <a class="brand" href="index.html" aria-label="Donne — home">
        <span class="brand-name">Donne.</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="index.html" >
          Home
        </a>
        <a href="graphic-design.html" >
          Graphic design
        </a>
        <a href="video-editing.html" aria-current="page">
          Video editing
        </a>
        <a class="nav-contact" href="index.html#contact">
          Let’s talk
        </a>
      </nav>
      <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Switch to dark mode">
        <span class="theme-label" aria-hidden="true">Light</span>
        <span class="theme-orb" aria-hidden="true">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a9 9 0 1 0 10.8 10.8Z"/></svg>
        </span>
      </button>

    </header>
    <main class="ve-page" id="main">
      <section class="ve-intro">
        <p class="ve-eyebrow">PORTFOLIO</p>
        <h1>Video Editing</h1>

        <nav
          class="ve-categories"
          aria-label="Video categories"
        ></nav>
      </section>

      <section class="ve-showcase" aria-label="Video gallery">
        <div class="ve-grid"></div>
        <p class="ve-empty" hidden>New work coming soon.</p>
      </section>
      <section class="portfolio-crosslink">
        <div>
          <p class="portfolio-small-label">ANOTHER SIDE OF THE WORK</p>
          <h2>Explore graphic design.</h2>
        </div>

        <a href="graphic-design.html" class="portfolio-crosslink-button">
          View graphic design
        </a>
      </section>
    </main>

    <!-- Larger video player -->
    <dialog class="ve-modal" aria-label="Video player">
      <div class="ve-player">
        <button
          class="ve-close"
          type="button"
          aria-label="Close video"
          autofocus
        >×</button>

        <video
          class="ve-full-video"
          controls
          controlslist="nodownload"
          playsinline
          preload="none"
        ></video>
      </div>
    </dialog>
    <!-- FOOTER — name and year filled automatically -->
    <footer class="footer wrap">
      <span>
        ©
        <span data-year>
          2026
        </span>
        <span data-name>
          Donne Crislee E. Vicera
        </span>
      </span>
      <span>
        Design with intention. Edit with feeling.
      </span>
      <a href="#main">
        Back to top
      </a>
    </footer>
    <!-- PROJECT DETAILS: JavaScript fills this accessible dialog from portfolio.js. -->
    <dialog id="project-dialog" aria-labelledby="dialog-title">
      <button class="close-dialog" type="button" aria-label="Close project details">
        ×
      </button>
      <div id="dialog-media">
      </div>
      <div class="dialog-copy">
        <p class="eyebrow" id="dialog-category">
        </p>
        <h2 id="dialog-title">
        </h2>
        <p id="dialog-description">
        </p>
        <a class="button" id="dialog-link" target="_blank" rel="noopener noreferrer" hidden>
          Open project
        </a>
      </div>
    </dialog>
  </body>
</html>
